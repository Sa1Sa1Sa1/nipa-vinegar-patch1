<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nipa Vinegar Mosquito Patch</title>

<!-- Firebase CDN -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<style>
body {
  margin: 0;
  font-family: "Segoe UI", sans-serif;
  background: #eef7ef;
  color: #1b3c1b;
  scroll-behavior: smooth;
}

header {
  background: linear-gradient(to right, #2e7d32, #66bb6a);
  padding: 20px;
  text-align: center;
  font-size: 28px;
  color: white;
  font-weight: bold;
  position: sticky;
  top: 0;
  z-index: 10;
}

nav {
  display: flex;
  justify-content: center;
  gap: 12px;
  flex-wrap: wrap;
  padding: 12px;
  background: #1b5e20;
  position: sticky;
  top: 70px;
  z-index: 9;
}

nav a {
  color: white;
  background: #2e7d32;
  padding: 10px 18px;
  border-radius: 8px;
  text-decoration: none;
  font-weight: bold;
  cursor: pointer;
}

nav a.active,
nav a:hover {
  background: #a5d6a7;
  color: #1b3c1b;
}

/* 🔹 VERY SUBTLE TRANSITION */
.section {
  display: none;
  padding: 25px;
  animation: fadeIn 0.25s ease;
}

.active-section {
  display: block;
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

.card {
  background: white;
  padding: 20px;
  border-radius: 14px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.1);
  margin-top: 15px;
}

.title {
  font-size: 24px;
  font-weight: bold;
  color: #1b5e20;
  margin-bottom: 10px;
}

.section img {
  width: 100%;
  max-width: 520px;
  display: block;
  margin: 15px auto;
  border-radius: 12px;
}

input, textarea {
  width: 100%;
  padding: 6px;
  border-radius: 8px;
  border: 1px solid #ccc;
}

button {
  padding: 10px 20px;
  background: #1b5e20;
  color: white;
  border: none;
  border-radius: 8px;
  cursor: pointer;
}

.rrl {
  background: #f4fff4;
  padding: 10px;
  border-left: 5px solid #2e7d32;
  margin-top: 10px;
  font-size: 14px;
}

.bullet-grid,
.side-by-side {
  display: grid;
  grid-template-columns: repeat(2,1fr);
  gap: 8px;
  margin-top: 10px;
}

.bullet {
  background: #f4fff4;
  border-left: 5px solid #2e7d32;
  border-radius: 10px;
  padding: 8px;
  font-size: 14px;
  text-align: center;
}

.big-thank {
  font-size: 36px;
  font-weight: bold;
  color: #2e7d32;
  text-align: center;
  margin-bottom: 20px;
}

#stars span {
  font-size: 28px;
  cursor: pointer;
  color: #ccc;
}

#stars span.active {
  color: #ffb300;
}
</style>
</head>

<body>

<header>🌿 Nipa Vinegar Mosquito Patch</header>

<nav>
  <a class="active" data-target="home">Home</a>
  <a data-target="nipa">About Nipa Tree</a>
  <a data-target="vinegar">Vinegar & Mosquito</a>
  <a data-target="locations">Locations</a>
  <a data-target="reviews">Reviews</a>
  <a data-target="feedback">Feedback</a>
  <a data-target="contact">Contact</a>
</nav>

<section id="home" class="section active-section">…</section>
<section id="nipa" class="section">…</section>
<section id="vinegar" class="section">…</section>
<section id="locations" class="section">…</section>
<section id="reviews" class="section"><div class="title">User Reviews</div></section>
<section id="feedback" class="section">…</section>
<section id="contact" class="section">…</section>

<script>
/* 🔹 SECTION NAVIGATION */
const sections = [...document.querySelectorAll(".section")];
const navLinks = document.querySelectorAll("nav a");
let currentIndex = 0;

function showSection(index) {
  sections.forEach(s => s.classList.remove("active-section"));
  navLinks.forEach(a => a.classList.remove("active"));
  sections[index].classList.add("active-section");
  navLinks[index].classList.add("active");
  currentIndex = index;
}

navLinks.forEach((link, index) => {
  link.addEventListener("click", () => showSection(index));
});

/* 🔹 SWIPE SUPPORT */
let startX = 0;

document.addEventListener("touchstart", e => {
  startX = e.touches[0].clientX;
});

document.addEventListener("touchend", e => {
  const endX = e.changedTouches[0].clientX;
  const diff = startX - endX;

  if (Math.abs(diff) > 60) {
    if (diff > 0 && currentIndex < sections.length - 1) {
      showSection(currentIndex + 1);
    } else if (diff < 0 && currentIndex > 0) {
      showSection(currentIndex - 1);
    }
  }
});
</script>

</body>
</html>
