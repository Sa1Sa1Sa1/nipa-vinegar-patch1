<style>
body {

  position: relative;
  overflow-x: hidden;
}

header {
  background: linear-gradient(to right, #2e7d32, #66bb6a);

  text-align: center;
  font-size: 28px;

  top: 0;
  z-index: 10;
}

nav {
  display: flex;

  gap: 12px;
  flex-wrap: wrap;
  padding: 12px;
  background: #1b5e20;

nav a {
  color: white;

  transition: all 0.3s ease;
}

nav a.active,
nav a:hover {
  background: #a5d6a7;
  color: #1b3c1b;
}

/* 🔥 SLIDE-IN TRANSITION INSTEAD OF FADE */
.section {
  position: absolute;
  top: 120px;
  left: 100%;
  width: 100%;
  pointer-events: none;
  transform: translateX(100%);
  transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  padding: 25px;
}

.active-section {
  pointer-events: all;
  position: relative;
  transform: translateX(0);
}

.card {
  background: white;
  padding: 20px;
  border-radius: 14px;
  box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
  margin-top: 15px;
  line-height: 1.6;
}

.title {
  font-size: 24px;
  font-weight: bold;
  color: #1b5e20;
  margin-bottom: 10px;
}

button {
  padding: 10px 20px;
  border: none;
  border-radius: 8px;
  background: #1b5e20;
  color: white;
  cursor: pointer;
}

input,
textarea {
  border-radius: 8px;
  border: 1px solid #ccc;
  font-size: 15px;
  padding: 5px;
  width: 100%;
}

.rrl {
  background: #f4fff4;
  padding: 10px;
  border-left: 5px solid #2e7d32;
  margin-top: 10px;
  font-size: 14px;
}

.section img {
  width: 100%;
  max-width: 520px;
  display: block;
  margin: 15px auto;
  border-radius: 12px;
}

#stars span {
  font-size: 28px;
  cursor: pointer;
  color: #ccc;
}

#stars span.active {
  color: #ffb300;
}

.bullet-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
  margin-top: 10px;
}

.bullet {
  background: #f4fff4;
  border-left: 5px solid #2e7d32;
  border-radius: 10px;
  padding: 8px 12px;
  font-size: 14px;
  text-align: center;
}

.side-by-side {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
  margin-top: 10px;
}

.big-thank {
  font-size: 36px;
  font-weight: bold;
  color: #2e7d32;
  text-align: center;
  margin-bottom: 20px;
}
</style>

const app = firebase.initializeApp(firebaseConfig);
const db = firebase.firestore(app);

const sections = document.querySelectorAll(".section");
const navLinks = document.querySelectorAll("nav a");

navLinks.forEach(link => {
  link.addEventListener("click", e => {
    e.preventDefault();
    const targetId = link.getAttribute("href").substring(1);
    const targetSection = document.getElementById(targetId);

    sections.forEach(sec => sec.classList.remove("active-section"));
    targetSection.classList.add("active-section");

    navLinks.forEach(a => a.classList.remove("active"));
    link.classList.add("active");

    targetSection.scrollIntoView({ behavior: "smooth" });
  });
});

function setRating(value) {
  document.getElementById("rating").value = value;
  document.querySelectorAll("#stars span").forEach((s, i) => {
    s.classList.toggle("active", i < value);
  });
}

    fbText.value = "";
    document.getElementById("rating").value = 0;
    document.querySelectorAll("#stars span").forEach(s => s.classList.remove("active"));
  });
}
