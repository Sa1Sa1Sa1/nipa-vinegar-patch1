<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nipa Vinegar Mosquito Patch</title>

  <!-- Firebase CDN -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top left, #e8f5e9, transparent 60%),
        radial-gradient(circle at bottom right, #c8e6c9, transparent 60%),
        #eef7ef;
      color: #1b3c1b;
      scroll-behavior: smooth;
      position: relative;
      overflow-x: hidden;
    }

    /* Floating decorative lines */
    body::before,
    body::after {
      content: "";
      position: fixed;
      width: 300px;
      height: 300px;
      border: 2px dashed rgba(46, 125, 50, 0.15);
      border-radius: 50%;
      z-index: 0;
    }

    body::before {
      top: -100px;
      left: -100px;
    }

    body::after {
      bottom: -120px;
      right: -120px;
    }

    /* Floating mosquito */
    .mosquito {
      position: fixed;
      top: 90px;
      right: 25px;
      font-size: 42px;
      animation: floatMosquito 4s ease-in-out infinite;
      z-index: 50;
      opacity: 0.85;
      pointer-events: none;
    }

    @keyframes floatMosquito {
      0% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-12px) rotate(8deg); }
      100% { transform: translateY(0) rotate(0deg); }
    }

    header {
      background: linear-gradient(to right, #2e7d32, #66bb6a);
      padding: 18px;
      text-align: center;
      font-size: 28px;
      color: white;
      font-weight: bold;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    nav {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      padding: 10px;
      background: rgba(27, 94, 32, 0.95);
      backdrop-filter: blur(6px);
      position: sticky;
      top: 70px;
      z-index: 9;
    }

    nav a {
      color: white;
      background: linear-gradient(135deg, #2e7d32, #43a047);
      padding: 9px 16px;
      border-radius: 999px;
      text-decoration: none;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }

    nav a.active,
    nav a:hover {
      background: #a5d6a7;
      color: #1b3c1b;
      transform: translateY(-2px);
    }

    .section {
      position: absolute;
      top: 120px;
      left: 0;
      width: 100%;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      padding: 20px;
      z-index: 1;
    }

    .active-section {
      opacity: 1;
      pointer-events: all;
      position: relative;
    }

    .card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(10px);
      padding: 18px;
      border-radius: 16px;
      box-shadow:
        0 10px 25px rgba(0, 0, 0, 0.12),
        inset 0 0 0 1px rgba(255,255,255,0.4);
      margin-top: 14px;
      line-height: 1.6;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.18);
    }

    .title {
      font-size: 23px;
      font-weight: bold;
      color: #1b5e20;
      margin-bottom: 8px;
    }

    button {
      padding: 10px 22px;
      border: none;
      border-radius: 999px;
      background: linear-gradient(135deg, #1b5e20, #388e3c);
      color: white;
      cursor: pointer;
      box-shadow: 0 6px 15px rgba(0,0,0,0.2);
    }

    input,
    textarea {
      border-radius: 10px;
      border: 1px solid #ccc;
      font-size: 14px;
      padding: 8px;
      width: 100%;
    }

    .rrl {
      background: #f4fff4;
      padding: 10px;
      border-left: 5px solid #2e7d32;
      margin-top: 10px;
      font-size: 14px;
      border-radius: 8px;
    }

    .section img {
      width: 100%;
      max-width: 480px;
      display: block;
      margin: 14px auto;
      border-radius: 14px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }

    #stars span {
      font-size: 26px;
      cursor: pointer;
      color: #ccc;
    }

    #stars span.active {
      color: #ffb300;
      text-shadow: 0 0 8px rgba(255,179,0,0.6);
    }

    .bullet-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-top: 10px;
    }

    .bullet {
      background: linear-gradient(135deg, #f1fff1, #e8f5e9);
      border-left: 5px solid #2e7d32;
      border-radius: 12px;
      padding: 8px 12px;
      font-size: 13px;
      text-align: center;
    }

    .side-by-side {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-top: 10px;
    }

    .big-thank {
      font-size: 34px;
      font-weight: bold;
      color: #2e7d32;
      text-align: center;
      margin-bottom: 16px;
      letter-spacing: 2px;
    }
  </style>
</head>

<body>

  <!-- Floating Mosquito -->
  <div class="mosquito">🦟</div>

  <!-- EVERYTHING ELSE REMAINS EXACTLY THE SAME -->

</body>
</html>
